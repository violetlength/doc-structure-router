[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["doc_router"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true